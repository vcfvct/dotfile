# Native Windows psmux entry point.
# Cross-platform options and bindings live in ~/.tmux.common.conf.

source-file ~/.tmux.common.conf

# -- Windows shell -------------------------------------------------------------

set -g default-shell pwsh
set -g default-command pwsh

# -- optional psmux plugins ----------------------------------------------------
# Install PPM once by following https://github.com/psmux/psmux-plugins#quick-start,
# then press Prefix + I. The battery plugin uses Win32_Battery instead of wmic.

set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-battery'

# -- theme ---------------------------------------------------------------------
# Native option lines are intentionally used here. The Unix oh-my-tmux theme is
# generated by a POSIX shell program and cannot be loaded natively by psmux.

set -g status-style 'fg=#8a8a8a,bg=#080808,none'
set -g status-left-style 'fg=#000000,bg=#ffff00,bold'
set -g status-right-style 'fg=#e4e4e4,bg=#080808,none'
set -g status-left-length 1000
set -g status-right-length 1000

set -g status-left ' #{?client_prefix,#[reverse]<Prefix>#[noreverse] ,}[#S] '
set -g status-right '#{?@battery_display,#{@battery_display} | ,}%H:%M | %d %b | #{username}@#{hostname} '

set -g window-status-style 'fg=#8a8a8a,bg=#080808,none'
set -g window-status-current-style 'fg=#000000,bg=#00afff,bold'
set -g window-status-activity-style 'fg=default,bg=default,underscore'
set -g window-status-bell-style 'fg=#ffff00,bg=default,bold'
set -g window-status-last-style 'fg=#00afff,bg=default,none'
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '

set -g message-style 'fg=#000000,bg=#ffff00,bold'
set -g message-command-style 'fg=#ffff00,bg=#000000,bold'
set -g mode-style 'fg=#000000,bg=#ffff00,bold'
set -g pane-border-style 'fg=#444444,bg=default'
set -g pane-active-border-style 'fg=#00afff,bg=default'

# -- Windows-only bindings -----------------------------------------------------

bind w new-window -n 'PowerShell' 'pwsh'

# Load PPM when it has been installed. Keep plugin initialization last.
if-shell 'Test-Path "$HOME/.psmux/plugins/ppm/ppm.ps1"' 'run-shell -b "~/.psmux/plugins/ppm/ppm.ps1"'
