$schema: "1.0"
name: dotfile-linuxbrew
# User task stages the checkout and runs read-only Preflight where possible.
# Installers and WSL platform changes are left for an interactive session.
userTasks:
  - name: ~/powershell
    parameters:
      command: |
        $ErrorActionPreference = 'Stop'
        $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH', 'User') + ';' + $env:PATH
        $repo = Join-Path $env:USERPROFILE 'source\repos\dotfile'
        if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
          Write-Warning 'Git is missing. Install it interactively using an approved method, then clone https://github.com/vcfvct/dotfile.git into your source/repos/dotfile folder.'
          Write-Host 'No software was installed by this customization. Continue with devbox/README.md after cloning.'
          return
        }
        if (-not (Test-Path -LiteralPath $repo)) {
          New-Item -ItemType Directory -Path (Split-Path $repo) -Force | Out-Null
          git clone --branch master https://github.com/vcfvct/dotfile.git $repo
          if ($LASTEXITCODE -ne 0) { throw 'Dotfiles clone failed. Check network access and retry manually.' }
        }
        $bootstrap = Join-Path $repo 'devbox\bootstrap.ps1'
        if (-not (Test-Path -LiteralPath $bootstrap)) {
          throw 'Bootstrap files are missing in the existing checkout. Update it explicitly, preserving local changes.'
        }
        if (Get-Command pwsh.exe -ErrorAction SilentlyContinue) {
          pwsh -NoLogo -NoProfile -File $bootstrap -Phase Preflight
          if ($LASTEXITCODE -ne 0) { throw 'Preflight failed. Review its output before proceeding.' }
        } else {
          Write-Warning 'PowerShell 7 is missing. Install it interactively before running bootstrap.ps1.'
        }
        Write-Host 'Checkout is staged. Finish setup interactively using devbox/README.md (WslPlatform if needed, then Windows, Wsl, Verify).'
