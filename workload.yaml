$schema: "1.0"
name: dotfile-linuxbrew
# User customization is read-only: no admin rights, WinGet, Git, PowerShell 7,
# WSL, or particular Dev Box image contents are assumed. Finish setup after sign-in.
userTasks:
  - name: ~/powershell
    parameters:
      command: |
        Write-Host 'Dotfile setup is interactive on this Dev Box; no software was installed by this customization.'
        foreach ($command in 'winget.exe', 'git.exe', 'pwsh.exe', 'wsl.exe') {
          $found = [bool](Get-Command $command -ErrorAction SilentlyContinue)
          Write-Host "$command available: $found"
        }
        Write-Host 'After signing in, follow devbox/README.md: install prerequisites with any required UI/admin approval, then run Preflight, Windows, Wsl, and Verify under your account.'
        Write-Host 'Repository: https://github.com/vcfvct/dotfile'
