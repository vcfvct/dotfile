# Shared tmux/psmux configuration.
# Keep this file limited to native tmux commands: no sh, PowerShell, plugins,
# platform-specific clipboard commands, or terminal capability overrides.

# -- general -------------------------------------------------------------------

# Use Ctrl+A as the prefix and keep Escape-key sequences responsive.
set -g prefix C-a
set -s escape-time 10
set -g history-limit 5000
set -g status-interval 10
set -g status-keys vi
set -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on

set -g display-panes-time 800
set -g display-time 1000
set -g monitor-activity on
set -g visual-activity off

# -- panes and windows ---------------------------------------------------------

# Find a session, and allow Ctrl+A twice to cycle panes.
bind C-f command-prompt -p find-session 'switch-client -t %%'
unbind ^A
bind ^A select-pane -t :.+
bind a send-prefix

# New panes and windows inherit the current working directory.
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind-key -n C-t new-window -c "#{pane_current_path}"

# Vim-style pane navigation and pane swapping.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind > swap-pane -D
bind < swap-pane -U

# Repeatable pane resizing.
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Window navigation.
unbind n
unbind p
bind p previous-window
bind n next-window
bind Tab last-window

# -- copy mode -----------------------------------------------------------------

# Vim-style selection and line movement. Platform entry points configure the
# actual operating-system clipboard integration.
bind Enter copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi H send-keys -X start-of-line
bind-key -T copy-mode-vi L send-keys -X end-of-line
